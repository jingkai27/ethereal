<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>36 Questions — Ethereal</title>
  <meta name="description" content="A quiet space to draw one of the 36 questions that bring people closer together." />
  <meta name="theme-color" content="#1a1130" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,400&family=Jost:wght@300;400;500&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <div class="stars" aria-hidden="true"></div>
  <div class="aurora aurora-a" aria-hidden="true"></div>
  <div class="aurora aurora-b" aria-hidden="true"></div>
  <div class="aurora aurora-c" aria-hidden="true"></div>

  <main class="scene">
    <header class="scene__header">
      <h1 class="scene__title">36&nbsp;Questions</h1>
      <p class="scene__subtitle">to yap so that we can get a little closer!</p>
    </header>

    <section class="card" id="card">
      <p class="card__eyebrow" id="progress">before we begin</p>
      <p class="card__question" id="question">Draw a question to begin the quiet.</p>
    </section>

    <div class="actions">
      <button class="draw-btn" id="drawBtn" type="button">
        <span class="draw-btn__label">Draw a Question</span>
      </button>
      <button class="reset-link" id="resetBtn" type="button" hidden>begin again</button>
    </div>

    <p class="scene__footnote">Arthur Aron's 36 Questions for closeness</p>
  </main>

  <script src="questions.js"></script>
  <script src="script.js"></script>
</body>

</html>
